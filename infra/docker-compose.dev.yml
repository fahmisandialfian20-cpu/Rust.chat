# =============================================================================
# Rust.chat — Development Docker Compose
# Run from repo root: docker compose -f infra/docker-compose.dev.yml up -d
#
# Path conventions (relative paths in this file resolve from infra/):
#   ../<path>   → project root (e.g. ../apps/server, ../.env)
#   ./          → this directory (infra/)
# =============================================================================

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: chatapp
      POSTGRES_PASSWORD: chatapp
      POSTGRES_DB: chatapp
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatapp"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - rust-chat

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - rust-chat

  server:
    build:
      context: ../apps/server
      dockerfile: Dockerfile
    env_file:
      - ../.env
    environment:
      # Override DATABASE_URL and REDIS_URL to use Docker service names
      DATABASE_URL: postgres://chatapp:chatapp@postgres:5432/chatapp
      REDIS_URL: redis://redis:6379
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - upload_data:/data/uploads
    networks:
      - rust-chat

  # LiveKit (voice/video — Phase 10+, disabled by default for MVP)
  # Uncomment and run with: docker compose -f infra/docker-compose.dev.yml up -d livekit
  # livekit:
  #   image: livekit/livekit-server:latest
  #   command: --config /etc/livekit.yaml
  #   ports:
  #     - "7880:7880"
  #     - "7881:7881"
  #   volumes:
  #     - ./livekit.yaml:/etc/livekit.yaml
  #   networks:
  #     - rust-chat

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    environment:
      PUBLIC_API_BASE_URL: http://localhost:8080/api/v1
      PUBLIC_WS_URL: ws://localhost:8080/api/v1/ws
    ports:
      - "3000:80"
    depends_on:
      server:
        condition: service_started
    networks:
      - rust-chat

volumes:
  pg_data:
  upload_data:

networks:
  rust-chat:
    driver: bridge
