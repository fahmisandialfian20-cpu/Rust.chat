services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: chatapp
      POSTGRES_PASSWORD: chatapp
      POSTGRES_DB: chatapp
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  server:
    build:
      context: ../apps/server
      dockerfile: Dockerfile
    env_file:
      - ../.env
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis
    volumes:
      - upload_data:/data/uploads

  livekit:
    image: livekit/livekit-server:latest
    command: --config /etc/livekit.yaml
    ports:
      - "7880:7880"
      - "7881:7881"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    environment:
      PUBLIC_API_BASE_URL: http://localhost:8080/api/v1
      PUBLIC_WS_URL: ws://localhost:8080/api/v1/ws
    ports:
      - "3000:80"
    depends_on:
      - server

volumes:
  pg_data:
  upload_data: