[package]
name = "rust-chat-server"
version = "0.1.0"
edition = "2021"

[dependencies]
axum            = { version = "0.8", features = ["ws", "multipart", "macros"] }
tower           = { version = "0.5", features = ["full"] }
tower-http      = { version = "0.6", features = ["full"] }
tokio           = { version = "1",   features = ["full"] }

sqlx            = { version = "0.8", features = [
    "runtime-tokio", "tls-rustls",
    "postgres", "macros", "migrate",
    "uuid", "time"
] }

redis           = { version = "0.27", features = ["tokio-comp", "connection-manager"] }

serde           = { version = "1.0", features = ["derive"] }
serde_json      = "1.0"

argon2          = { version = "0.5.3", features = ["std"] }
jsonwebtoken    = { version = "10",    features = ["rust_crypto"] }
uuid            = { version = "1.23.1", features = ["v4", "v7", "serde"] }

chrono         = "0.4"
async-trait    = "0.1"
rand          = "0.8"
sha2          = "0.10"

tracing             = { version = "0.1.44", features = ["attributes"] }
tracing-subscriber  = { version = "0.3.23", features = ["env-filter", "json", "fmt"] }

object_store    = { version = "0.12.5", features = ["aws", "gcp", "azure"] }
bytes           = "1"
futures-util    = "0.3"

dotenvy         = "0.15"
thiserror       = "2"
anyhow          = "1"
time            = { version = "0.3", features = ["serde"] }
url             = "2"