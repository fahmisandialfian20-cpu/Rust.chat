[package]
name = "rust-chat"
version = "0.1.0"
description = "Rust.chat Desktop App"
authors = ["Rust.chat Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]